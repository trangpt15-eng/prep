<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capybara Game - Play</title>
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        
        body {
            font-family: 'Mali', cursive;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #fdf2f8, #f3e8ff); /* Pastel pink/purple */
            min-height: 100vh;
            overflow-x: hidden;
            user-select: none;
        }

        #setup-page { display: block; }
        #game-page { display: none; }
        body.game-mode #setup-page { display: none; }
        body.game-mode #game-page { display: block; }

        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 2px solid #fbcfe8;
        }

        .item-list-container {
            max-height: 400px;
            overflow-y: auto;
        }

        #game-page {
            position: relative;
            width: 100vw;
            height: 100vh;
            background-image: url('background.jpg');
            background-size: cover;
            background-position: center bottom;
            background-repeat: no-repeat;
            overflow: hidden;
        }

        .caves-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .cave-wrapper {
            position: absolute;
            width: 35vw;
            max-width: 450px;
            min-width: 250px;
            cursor: pointer;
            transition: transform 0.2s;
            -webkit-tap-highlight-color: transparent; 
        }

        /* Staggered Layout Positioning */
        .cave-1 { top: 15%; left: 10%; z-index: 10; }
        .cave-2 { top: 15%; right: 10%; z-index: 10; }
        .cave-3 { top: 65%; left: 50%; transform: translateX(-50%); z-index: 30; }
        
        /* Fix hover interfering with transform translate on cave 3 */
        .cave-3:hover { transform: translateX(-50%) scale(1.02); }
        .cave-1:hover, .cave-2:hover { transform: scale(1.02); }

        .cave-img {
            width: 100%;
            height: auto;
            display: block;
            position: relative;
            z-index: 10;
        }

        @keyframes cave-bounce {
            0% { transform: scale(1); }
            40% { transform: scale(1.1) translateY(-15px); }
            60% { transform: scale(0.95) translateY(5px); }
            100% { transform: scale(1); }
        }
        
        .cave-3.cave-pop { animation: cave-bounce-center 0.5s cubic-bezier(0.25, 1, 0.5, 1); }
        @keyframes cave-bounce-center {
            0% { transform: translateX(-50%) scale(1); }
            40% { transform: translateX(-50%) scale(1.1) translateY(-15px); }
            60% { transform: translateX(-50%) scale(0.95) translateY(5px); }
            100% { transform: translateX(-50%) scale(1); }
        }

        .cave-pop {
            animation: cave-bounce 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        @keyframes particle-fly {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0) rotate(180deg); opacity: 0; }
        }

        .particle {
            position: absolute;
            pointer-events: none;
            z-index: 50;
            font-size: 2.5rem;
            animation: particle-fly 0.7s ease-out forwards;
        }

        .capybara-popup {
            position: absolute;
            bottom: -15%; 
            left: 50%;
            width: 140%; 
            transform: translateX(-50%) translateY(50px) scale(0.5);
            opacity: 0;
            pointer-events: none;
            z-index: 40;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-origin: bottom center;
        }

        .capybara-popup.active {
            opacity: 1;
            transform: translateX(-50%) translateY(0) scale(1);
            pointer-events: auto;
        }

        .capybara-img {
            width: 100%;
            height: auto;
            display: block;
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.3));
        }

        .bubble-content {
            position: absolute;
            /* Moved much higher to sit in the visual center of the bubble cloud */
            top: 5%; 
            right: 4%; 
            width: 50%; 
            height: 55%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2%;
            box-sizing: border-box;
            text-align: center;
            overflow: hidden;
        }

        .bubble-content span {
            font-size: clamp(1.5rem, 3vw, 3rem);
            font-weight: 700;
            color: #86198f;
            word-wrap: break-word;
            line-height: 1.2;
            max-height: 100%;
            overflow: hidden;
            text-shadow: none; /* No shadow */
        }

        .bubble-content img {
            max-width: 95%;
            max-height: 95%;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: none; /* Removed shadow */
        }

        /* Custom Scrollbar for Setup Page */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #fce7f3; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #f472b6; border-radius: 4px; }
    
        body { margin: 0; padding: 0; overflow: hidden; }
        #game-page { display: block !important; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <div id="game-page" onclick="hideAllCapybaras()">
        <div class="caves-container">
            
            <!-- Cave 1 (Top Left) -->
            <div class="cave-wrapper cave-1" id="cave-el-1" onclick="triggerCave(event, 1, this)">
                <img src="1.png" alt="Cave 1" class="cave-img">
                <div class="capybara-popup" id="capybara-1">
                    <img src="speech.png" alt="Capybara" class="capybara-img">
                    <div class="bubble-content" id="bubble-1"></div>
                </div>
            </div>

            <!-- Cave 2 (Top Right) -->
            <div class="cave-wrapper cave-2" id="cave-el-2" onclick="triggerCave(event, 2, this)">
                <img src="2.png" alt="Cave 2" class="cave-img">
                <div class="capybara-popup" id="capybara-2">
                    <img src="speech.png" alt="Capybara" class="capybara-img">
                    <div class="bubble-content" id="bubble-2"></div>
                </div>
            </div>

            <!-- Cave 3 (Bottom Center - Highest Z-Index) -->
            <div class="cave-wrapper cave-3" id="cave-el-3" onclick="triggerCave(event, 3, this)">
                <img src="3.png" alt="Cave 3" class="cave-img">
                <div class="capybara-popup" id="capybara-3">
                    <img src="speech.png" alt="Capybara" class="capybara-img">
                    <div class="bubble-content" id="bubble-3"></div>
                </div>
            </div>

        </div>
    </div>
    
    <script>
        const gameItems = [{"type":"text","content":"in"},{"type":"text","content":"down"},{"type":"text","content":"below"},{"type":"text","content":"under"},{"type":"text","content":"is"},{"type":"text","content":"am"},{"type":"text","content":"are"},{"type":"text","content":"without"},{"type":"text","content":"about"},{"type":"text","content":"me"},{"type":"text","content":"his"},{"type":"text","content":"seem"},{"type":"text","content":"like to"},{"type":"text","content":"taste"},{"type":"text","content":"will"},{"type":"text","content":"after"},{"type":"text","content":"against"},{"type":"text","content":"across"},{"type":"text","content":"along"},{"type":"text","content":"off"},{"type":"text","content":"on"},{"type":"text","content":"inside"},{"type":"text","content":"beneath"},{"type":"text","content":"near"},{"type":"text","content":"skill"},{"type":"text","content":"out"},{"type":"text","content":"to"},{"type":"text","content":"from"},{"type":"text","content":"at"},{"type":"text","content":"into"}];
        let lastShownItem = null;

        function hideAllCapybaras() {
            document.querySelectorAll('.capybara-popup').forEach(el => {
                el.classList.remove('active');
            });
        }

        function getRandomItem() {
            if (gameItems.length === 1) return gameItems[0];
            let availableItems = gameItems.filter(item => item !== lastShownItem);
            if (availableItems.length === 0) availableItems = gameItems; 
            const randomIndex = Math.floor(Math.random() * availableItems.length);
            const selectedItem = availableItems[randomIndex];
            lastShownItem = selectedItem;
            return selectedItem;
        }

        function spawnParticles(caveElement) {
            const rect = caveElement.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            const numParticles = 12;
            const container = document.getElementById('game-page');
            
            for(let i = 0; i < numParticles; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                const emojis = ['✨', '🌸', '💖', '🌟'];
                p.textContent = emojis[Math.floor(Math.random() * emojis.length)]; 
                container.appendChild(p);
                p.style.left = (centerX - 20) + 'px';
                p.style.top = (centerY - 20) + 'px';
                const angle = Math.random() * Math.PI * 2;
                const velocity = 100 + Math.random() * 150; 
                const tx = Math.cos(angle) * velocity;
                const ty = Math.sin(angle) * velocity;
                p.style.setProperty('--tx', `${tx}px`);
                p.style.setProperty('--ty', `${ty}px`);
                setTimeout(() => p.remove(), 700);
            }
        }

        function triggerCave(event, caveId, caveElement) {
            event.stopPropagation(); 
            
            const clickSound = new Audio('sound_3.m4a');
            clickSound.volume = 0.5;
            clickSound.play().catch(e => console.log("Audio play failed:", e));

            const popup = document.getElementById('capybara-' + caveId);
            const bubble = document.getElementById('bubble-' + caveId);
            
            if (popup.classList.contains('active')) {
                popup.classList.remove('active');
                return;
            }

            hideAllCapybaras();

            caveElement.classList.remove('cave-pop');
            void caveElement.offsetWidth;
            caveElement.classList.add('cave-pop');
            spawnParticles(caveElement);

            const item = getRandomItem();
            bubble.innerHTML = '';
            
            if (item) {
                if (item.type === 'text') {
                    const span = document.createElement('span');
                    span.textContent = item.content;
                    bubble.appendChild(span);
                } else if (item.type === 'image') {
                    const img = document.createElement('img');
                    img.src = item.content;
                    bubble.appendChild(img);
                }
            }
            popup.classList.add('active');
        }
        
        // Setup global click listener to hide capybaras
        document.getElementById('game-page').addEventListener('click', hideAllCapybaras);
        
        // Re-attach click events to caves dynamically in the exported file
        document.getElementById('cave-el-1').onclick = function(e) { triggerCave(e, 1, this) };
        document.getElementById('cave-el-2').onclick = function(e) { triggerCave(e, 2, this) };
        document.getElementById('cave-el-3').onclick = function(e) { triggerCave(e, 3, this) };
    </script>
</body>
</html>
